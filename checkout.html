<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>訂購資料｜季兒花藝</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            font-family: "Noto Sans TC", sans-serif;
            background: #f8f9fa;
            padding-top: 40px;
            padding-bottom: 60px;
        }

        .checkout-container {
            max-width: 900px;
            margin: auto;
        }

        .checkout-title {
            color: #1B5E20;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .checkout-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .checkout-card h3 {
            color: #1B5E20;
            font-size: 21px;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: 0;
        }

        .order-item img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .order-item-price {
            color: #777;
            font-size: 14px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 700;
            margin-top: 20px;
        }

        .order-total-price {
            color: #1B5E20;
        }

        .form-label {
            font-weight: 600;
        }

        .required {
            color: #d32f2f;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #1B5E20;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: #2E7D32;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #1B5E20;
            text-decoration: none;
        }

        .empty-order {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

    </style>

</head>


<body>


<div class="container checkout-container">


    <a href="index.html"
       class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        返回網站

    </a>


    <h1 class="checkout-title">

        <i class="fa-solid fa-clipboard-list"></i>

        訂購資料

    </h1>


    <!-- ==========================
         已選商品
    =========================== -->

    <div class="checkout-card">

        <h3>

            <i class="fa-solid fa-cart-shopping"></i>

            您選購的商品

        </h3>


        <div id="checkout-items">

            <!-- JavaScript 會把購物車商品放這裡 -->

        </div>


        <div class="order-total">

            <span>
                合計
            </span>

            <span
                class="order-total-price"
                id="checkout-total">

                NT$ 0

            </span>

        </div>

    </div>


    <!-- ==========================
         訂購人資料
    =========================== -->

    <div class="checkout-card">

        <h3>

            <i class="fa-solid fa-user"></i>

            訂購人資料

        </h3>


        <form id="checkout-form">


            <div class="mb-3">

                <label class="form-label">

                    姓名
                    <span class="required">*</span>

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="customer-name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">

                    電話
                    <span class="required">*</span>

                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="customer-phone"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">

                    LINE 名稱

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="customer-line">

            </div>


            <div class="mb-3">

                <label class="form-label">

                    配送地址

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="customer-address">

            </div>


            <div class="mb-3">

                <label class="form-label">

                    希望送達日期及時間

                </label>

                <input
                    type="date"
                    class="form-control"
                    id="delivery-date">

            </div>


            <div class="mb-3">

                <label class="form-label">

                    備註

                </label>

                <textarea
                    class="form-control"
                    id="customer-note"
                    rows="4"
                    placeholder="例如：希望花束顏色、配送時間、卡片內容等"></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn">

                確認送出訂購資料

            </button>


        </form>

    </div>


</div>


<script src="js/cart.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    const itemsContainer =
        document.getElementById("checkout-items");

    const totalElement =
        document.getElementById("checkout-total");


    /*
     * 取得購物車
     *
     * 這裡會讀取 cart.js 儲存的商品
     */

    let cart = [];


    try {

        const savedCart =
            localStorage.getItem("jilFlowerCart");

        if (savedCart) {

            cart = JSON.parse(savedCart);

        }

    } catch (error) {

        console.error("讀取購物車失敗", error);

    }


    /* ==========================
       沒有商品
    =========================== */

    if (!cart || cart.length === 0) {

        itemsContainer.innerHTML = `

            <div class="empty-order">

                <i class="fa-solid fa-cart-shopping"
                   style="font-size:40px;"></i>

                <p class="mt-3">

                    目前購物車沒有商品。

                </p>

                <a href="index.html"
                   class="btn btn-success">

                    返回選購商品

                </a>

            </div>

        `;

        return;

    }


    /* ==========================
       顯示商品
    =========================== */

    let total = 0;


    cart.forEach(function (item) {


        const price =
            Number(item.price) || 0;


        const quantity =
            Number(item.quantity) || 1;


        const subtotal =
            price * quantity;


        total += subtotal;


        const image =
            item.image || "";


        const imageHTML = image

            ? `<img src="${image}" alt="${item.name}">`

            : "";


        itemsContainer.innerHTML += `

            <div class="order-item">

                ${imageHTML}

                <div class="order-item-info">

                    <div class="order-item-name">

                        ${item.name}

                    </div>

                    <div class="order-item-price">

                        NT$ ${price.toLocaleString()}

                        × ${quantity}

                    </div>

                </div>

                <strong>

                    NT$ ${subtotal.toLocaleString()}

                </strong>

            </div>

        `;

    });


    totalElement.textContent =
        "NT$ " + total.toLocaleString();


    /* ==========================
       表單
    =========================== */

    const form =
        document.getElementById("checkout-form");


    form.addEventListener("submit", function (event) {

        event.preventDefault();


        const name =
            document.getElementById("customer-name").value.trim();


        const phone =
            document.getElementById("customer-phone").value.trim();


        if (!name || !phone) {

            alert("請填寫姓名與電話。");

            return;

        }


        alert(
            "訂購資料已填寫完成！\n\n" +
            "下一步我們再處理訂單送出方式。"
        );

    });


});

</script>


</body>

</html>
