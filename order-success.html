<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>訂購成功｜季兒花藝 × 綠光工程</title>

    <meta name="description" content="季兒花藝訂購成功頁面">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --green: #1B5E20;
            --green-light: #2E7D32;
            --gold: #D4AF37;
            --light: #f8f9fa;
            --dark: #222;
            --gray: #666;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans TC", sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .success-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .success-card {
            width: 100%;
            max-width: 650px;
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f5e9;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .success-title {
            text-align: center;
            color: var(--green);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .success-text {
            text-align: center;
            color: var(--gray);
            margin-bottom: 30px;
        }

        .order-number-box {
            background: #f8f8f8;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 25px;
        }

        .order-number-label {
            display: block;
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .order-number {
            font-size: 22px;
            font-weight: 700;
            color: var(--green);
            word-break: break-all;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 15px;
            border-left: 4px solid var(--gold);
            padding-left: 10px;
        }

        .customer-info {
            background: #fafafa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .customer-row {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .customer-row:last-child {
            border-bottom: none;
        }

        .customer-label {
            min-width: 85px;
            font-weight: 600;
            color: #555;
        }

        .customer-value {
            flex: 1;
            color: #333;
            word-break: break-word;
        }

        .order-items {
            margin-bottom: 25px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item-name {
            font-weight: 600;
        }

        .order-item-detail {
            color: var(--gray);
            font-size: 14px;
            margin-top: 3px;
        }

        .order-item-price {
            white-space: nowrap;
            font-weight: 600;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f8f1;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 30px;
        }

        .order-total-label {
            font-weight: 600;
        }

        .order-total-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--green);
        }

        .button-area {
            display: flex;
            gap: 12px;
        }

        .btn-home,
        .btn-shop {
            flex: 1;
            padding: 13px 15px;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-home {
            background: var(--green);
            color: #fff;
        }

        .btn-home:hover {
            background: var(--green-light);
            color: #fff;
        }

        .btn-shop {
            background: #fff;
            color: var(--green);
            border: 1px solid var(--green);
        }

        .btn-shop:hover {
            background: #f1f8f1;
            color: var(--green);
        }

        .empty-message {
            text-align: center;
            color: var(--gray);
            padding: 30px 10px;
        }

        @media (max-width: 576px) {
            .success-card {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .success-title {
                font-size: 24px;
            }

            .order-number {
                font-size: 18px;
            }

            .customer-row {
                display: block;
            }

            .customer-label {
                display: block;
                margin-bottom: 3px;
            }

            .button-area {
                flex-direction: column;
            }

            .order-item {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="success-wrapper">

    <div class="success-card" id="success-card">

        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 class="success-title">
            訂購成功！
        </h1>

        <p class="success-text">
            感謝您的訂購，我們會盡快與您聯絡確認訂單。
        </p>

        <!-- 訂單編號 -->
        <div class="order-number-box">
            <span class="order-number-label">訂單編號</span>
            <div class="order-number" id="order-number">
                -
            </div>
        </div>

        <!-- 客戶資料 -->
        <h2 class="section-title">
            訂購資料
        </h2>

        <div class="customer-info">

            <div class="customer-row">
                <div class="customer-label">姓名</div>
                <div class="customer-value" id="customer-name">-</div>
            </div>

            <div class="customer-row">
                <div class="customer-label">電話</div>
                <div class="customer-value" id="customer-phone">-</div>
            </div>

            <div class="customer-row" id="line-row">
                <div class="customer-label">LINE</div>
                <div class="customer-value" id="customer-line">-</div>
            </div>

            <div class="customer-row" id="address-row">
                <div class="customer-label">地址</div>
                <div class="customer-value" id="customer-address">-</div>
            </div>

            <div class="customer-row">
                <div class="customer-label">預定日期</div>
                <div class="customer-value" id="delivery-date">-</div>
            </div>

            <div class="customer-row" id="note-row">
                <div class="customer-label">備註</div>
                <div class="customer-value" id="customer-note">-</div>
            </div>

        </div>

        <!-- 商品 -->
        <h2 class="section-title">
            訂購商品
        </h2>

        <div class="order-items" id="order-items">
        </div>

        <!-- 總金額 -->
        <div class="order-total">

            <span class="order-total-label">
                訂單總金額
            </span>

            <span class="order-total-price" id="order-total">
                NT$ 0
            </span>

        </div>

        <!-- 按鈕 -->
        <div class="button-area">

            <a href="index.html" class="btn-home">
                <i class="fa-solid fa-house"></i>
                回首頁
            </a>

            <a href="index.html#flower-services" class="btn-shop">
                <i class="fa-solid fa-bag-shopping"></i>
                繼續選購
            </a>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const orderData = localStorage.getItem("jilflower_last_order");

    // 如果找不到訂單資料
    if (!orderData) {

        document.getElementById("success-card").innerHTML = `
            <div class="empty-message">

                <div class="success-icon">
                    <i class="fa-solid fa-file-circle-question"></i>
                </div>

                <h1 class="success-title">
                    找不到訂單資料
                </h1>

                <p>
                    目前沒有可以顯示的訂單。
                </p>

                <a href="index.html" class="btn-home d-block mt-4">
                    回首頁
                </a>

            </div>
        `;

        return;
    }


    let order;

    try {

        order = JSON.parse(orderData);

    } catch (error) {

        console.error("訂單資料讀取失敗：", error);

        document.getElementById("success-card").innerHTML = `
            <div class="empty-message">

                <div class="success-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h1 class="success-title">
                    訂單資料讀取失敗
                </h1>

                <p>
                    請返回首頁重新操作。
                </p>

                <a href="index.html" class="btn-home d-block mt-4">
                    回首頁
                </a>

            </div>
        `;

        return;
    }


    // =========================
    // 訂單編號
    // =========================

    document.getElementById("order-number").textContent =
        order.orderNumber || "-";


    // =========================
    // 客戶資料
    // =========================

    const customer = order.customer || {};

    document.getElementById("customer-name").textContent =
        customer.name || "-";

    document.getElementById("customer-phone").textContent =
        customer.phone || "-";

    document.getElementById("customer-line").textContent =
        customer.line || "-";

    document.getElementById("customer-address").textContent =
        customer.address || "-";

    document.getElementById("delivery-date").textContent =
        customer.deliveryDate || "-";

    document.getElementById("customer-note").textContent =
        customer.note || "-";


    // =========================
    // 商品
    // =========================

    const itemsContainer =
        document.getElementById("order-items");

    const items = order.items || [];

    if (items.length === 0) {

        itemsContainer.innerHTML = `
            <div class="empty-message">
                沒有商品資料
            </div>
        `;

    } else {

        itemsContainer.innerHTML = items.map(function (item) {

            const name = item.name || "商品";

            const quantity = Number(item.quantity) || 1;

            const price = Number(item.price) || 0;

            const subtotal =
                Number(item.subtotal) ||
                price * quantity;

            return `
                <div class="order-item">

                    <div>

                        <div class="order-item-name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="order-item-detail">
                            NT$ ${price.toLocaleString()} × ${quantity}
                        </div>

                    </div>

                    <div class="order-item-price">
                        NT$ ${subtotal.toLocaleString()}
                    </div>

                </div>
            `;

        }).join("");

    }


    // =========================
    // 總金額
    // =========================

    const total = Number(order.total) || 0;

    document.getElementById("order-total").textContent =
        "NT$ " + total.toLocaleString();


});


// =========================
// 防止商品名稱出現 HTML
// =========================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>ㄟｃo
